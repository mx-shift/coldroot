[package]
name = "coldroot-hsm"
description = "YubiHSM 2 implementation of the HSM interface coldroot's ceremonies use"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
coldroot-ceremony = { path = "../ceremony" }
yubihsm = { version = "0.42.1", features = ["usb"] }

[dev-dependencies]
coldroot-core = { path = "../core" }
yubihsm = { version = "0.42.1", features = ["mockhsm", "usb"] }
